<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NoExit — Run Viewer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap');

  :root {
    --bg:       #0c0c0d;
    --surface:  #141416;
    --surface2: #1a1a1d;
    --border:   #272729;
    --border2:  #333336;
    --accent:   #c9a86c;   /* candlelight gold */
    --accent2:  #6c7fcd;   /* cold blue */
    --dim:      #4a4a55;
    --dim2:     #6a6a75;
    --text:     #ccccd0;
    --text-hi:  #eeeae4;
    --sys-col:  #4a7a55;
    --usr-col:  #5a7aaa;
    --ast-col:  #9a7a4a;
    --none-col: #7a4a4a;
    --ply-col:  #5aa08a;   /* player message rows */
    --warn:     #b5734a;   /* cold start / cutoff */
    --ok:       #4a7a55;
    --grp-request:   #9a7fd6;
    --grp-tokens:    #4aa7a0;
    --grp-perf:      #c0524a;
    --grp-eval:      #c15fa0;
    --grp-character: #5aa9e6;
    --mono: 'IBM Plex Mono', monospace;
    --serif: 'Crimson Pro', Georgia, serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* native page scrollbar hidden in favor of the always-visible custom one below
     (some browsers' overlay-scrollbar mode ignores ::-webkit-scrollbar styling entirely) */
  html { overflow-y: scroll; scrollbar-width: none; }
  html::-webkit-scrollbar { display: none; width: 0; height: 0; }

  #custom-scrollbar {
    position: fixed; top: 0; right: 0; bottom: 0; width: 14px;
    background: var(--surface); border-left: 1px solid var(--border);
    z-index: 200; display: none;
  }
  #custom-scrollbar.show { display: block; }
  #custom-scrollbar-thumb {
    position: absolute; left: 2px; right: 2px; min-height: 30px;
    background: var(--border2); border-radius: 5px; cursor: pointer;
  }
  #custom-scrollbar-thumb:hover, #custom-scrollbar-thumb.dragging { background: var(--accent); }
  body.has-custom-scrollbar { padding-right: 14px; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.6;
    min-height: 100vh;
  }

  a { color: var(--accent2); }

  /* ── drop zone ── */
  #drop-zone {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px; background: var(--bg); z-index: 100;
    transition: opacity .25s;
  }
  #drop-zone.hidden { opacity: 0; pointer-events: none; }
  #drop-zone .icon { font-size: 40px; opacity: .25; }
  #drop-zone h2 {
    font-family: var(--serif); font-weight: 300;
    font-size: 24px; color: var(--text-hi); letter-spacing: .5px;
  }
  #drop-zone p { color: var(--dim2); max-width: 460px; text-align: center; }
  #drop-zone.dragover { background: var(--surface); }
  #drop-zone.dragover .icon { opacity: .6; color: var(--accent); }
  .pick-btn {
    font-family: var(--mono); font-size: 12px;
    background: var(--surface2); color: var(--text-hi);
    border: 1px solid var(--border2); padding: 8px 18px;
    cursor: pointer; letter-spacing: .5px;
  }
  .pick-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ── top bar ── */
  #topbar {
    position: sticky; top: 0; z-index: 50;
    background: var(--surface); border-bottom: 1px solid var(--border2);
    padding: 10px 18px; display: flex; align-items: center;
    gap: 18px; flex-wrap: wrap;
  }
  #topbar .brand {
    font-family: var(--serif); font-size: 18px; font-weight: 300;
    color: var(--accent); letter-spacing: .5px; white-space: nowrap;
  }
  #topbar .brand span { color: var(--dim2); font-size: 12px; font-family: var(--mono); }
  .spacer { flex: 1; }

  .seg { display: flex; border: 1px solid var(--border2); }
  .seg button {
    font-family: var(--mono); font-size: 11px; letter-spacing: .5px;
    background: var(--surface2); color: var(--dim2);
    border: none; padding: 6px 14px; cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--border2); }
  .seg button.active { background: var(--accent); color: #16130c; font-weight: 600; }

  .toggles { display: flex; gap: 6px; flex-wrap: wrap; }
  .toggle {
    font-size: 10px; letter-spacing: .5px; text-transform: uppercase;
    padding: 4px 9px; border: 1px solid var(--border2);
    color: var(--dim2); cursor: pointer; user-select: none;
  }
  .toggle.on { color: var(--text-hi); border-color: var(--dim2); }

  .barbtn {
    font-family: var(--mono); font-size: 11px;
    background: var(--surface2); color: var(--dim2);
    border: 1px solid var(--border2); padding: 6px 12px; cursor: pointer;
  }
  .barbtn:hover { color: var(--accent); border-color: var(--accent); }

  /* ── layout ── */
  #app { display: none; padding: 0 0 80px; }
  #app.show { display: block; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 20px 18px; }

  /* ── run summary strip ── */
  .runstat {
    display: flex; gap: 22px; flex-wrap: wrap;
    padding: 12px 16px; background: var(--surface);
    border: 1px solid var(--border); margin-bottom: 18px;
  }
  .runstat .item { display: flex; flex-direction: column; gap: 2px; }
  .runstat .k { font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: var(--dim2); }
  .runstat .v { font-size: 15px; color: var(--text-hi); }
  .runstat .v.gold { color: var(--accent); }

  /* ── game session view: one eval card per loaded run, whole-session judgment.
     Short by nature (no long text to scroll), so unlike chargen/table it just
     flows in the normal page -- no bounded height, no dedicated scroll box. ── */
  #session-view { display: none; flex-direction: column; gap: 14px; }
  #session-view.show { display: flex; }

  /* ── character generation view: two independently-scrolling panes,
     both bounded to the viewport so neither scrolls the page itself ── */
  #chargen-view { display: flex; gap: 20px; align-items: stretch; }
  #chargen-view.hide { display: none; }
  #chargen-evals, #chargen-bios { overflow-y: auto; }
  #chargen-evals { flex: 0 0 340px; }
  #chargen-bios { flex: 1; min-width: 0; }
  @media (max-width: 900px){
    #chargen-view { flex-direction: column; }
    #chargen-evals, #chargen-bios { height: auto !important; max-height: 60vh; }
  }

  /* ── character panel ── */
  .chars { display: flex; flex-direction: column; gap: 20px; }
  .rungroup { display: flex; flex-direction: column; gap: 10px; }
  .chars-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
  .pairbar { background: var(--surface); border: 1px solid var(--border); border-top: 2px solid var(--grp-character); padding: 10px 14px; }
  .pairbar-h { font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: var(--dim2); margin-bottom: 6px; }
  .charcard-evalh {
    font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: var(--dim2);
    margin-bottom: 8px;
  }
  .charcard {
    background: var(--surface); border: 1px solid var(--border);
    border-top: 2px solid var(--accent); padding: 14px 16px;
  }
  .charcard h3 {
    font-family: var(--serif); font-weight: 400; font-size: 18px;
    color: var(--text-hi); margin-bottom: 2px;
  }
  .charcard .sub { color: var(--dim2); font-size: 10px; letter-spacing: .5px; margin-bottom: 10px; }
  .charcard .bio {
    font-family: var(--serif); font-size: 14px; line-height: 1.7;
    color: var(--text); white-space: pre-wrap; max-height: 200px; overflow: hidden;
    position: relative;
  }
  .charcard .bio.expanded { max-height: none; }
  .charcard .fade {
    position: absolute; bottom: 0; left: 0; right: 0; height: 46px;
    background: linear-gradient(transparent, var(--surface));
  }
  .charcard .bio.expanded .fade { display: none; }
  .charcard .more { color: var(--accent2); cursor: pointer; font-size: 10px; margin-top: 6px; display: inline-block; }

  .evalempty { color: var(--dim); font-style: italic; }

  /* ── editable eval form (human scoring) ── */
  .evalform { padding: 8px 0 0; display: flex; flex-direction: column; gap: 10px; }
  .evalrow { display: flex; align-items: center; gap: 10px; padding: 3px 0; }
  .evalbtns { display: flex; gap: 6px; flex-shrink: 0; }
  .evalbtn {
    font-family: var(--mono); font-size: 11px; padding: 6px 10px; cursor: pointer;
    background: var(--surface2); color: var(--dim2); border: 1px solid var(--border2);
    text-transform: uppercase; letter-spacing: .5px; flex: 1; text-align: center;
  }
  .evalbtn:hover { color: var(--text-hi); border-color: var(--dim2); }
  .evalbtn.good.active { background: var(--ok); border-color: var(--ok); color: #0e1a10; font-weight: 600; }
  .evalbtn.bad.active { background: var(--none-col); border-color: var(--none-col); color: #1a0e0e; font-weight: 600; }
  .evalbtn.neutral.active { background: var(--accent); border-color: var(--accent); color: #16130c; font-weight: 600; }
  .evalnotes textarea {
    width: 100%; min-height: 46px; resize: vertical; font-family: var(--mono); font-size: 11px;
    background: var(--surface2); color: var(--text); border: 1px solid var(--border2); padding: 6px 8px;
  }
  .evalnotes textarea:focus { outline: none; border-color: var(--accent); }
  .evalbadge { font-size: 9px; letter-spacing: .5px; text-transform: uppercase; color: var(--dim2); }
  .evalbadge.scored { color: var(--accent); }
  #save-btn { border-color: var(--accent); color: var(--accent); }
  #save-btn:hover { background: var(--accent); color: #16130c; }
  #save-btn:disabled { border-color: var(--border2); color: var(--dim); cursor: default; background: var(--surface2); }

  /* ── table view ──
     Bounded to the remaining viewport height (see syncTableHeight) so it is the
     ONE scroll container, both axes -- same pattern as #chargen-evals/#chargen-bios.
     That makes the sticky header's `top` purely local to this box (just its own
     group-row height, see syncStickyHeader) instead of depending on the page's
     scroll state, which is what made the old page-scroll design fragile. */
  #table-view { display: none; overflow: auto; scrollbar-width: none; }
  #table-view::-webkit-scrollbar { display: none; height: 0; }
  #table-view.show { display: block; }

  #custom-hscrollbar {
    position: fixed; left: 0; right: 14px; bottom: 0; height: 14px;
    background: var(--surface); border-top: 1px solid var(--border);
    z-index: 200; display: none;
  }
  #custom-hscrollbar.show { display: block; }
  #custom-hscrollbar-thumb {
    position: absolute; top: 2px; bottom: 2px; min-width: 30px;
    background: var(--border2); border-radius: 5px; cursor: pointer;
  }
  #custom-hscrollbar-thumb:hover, #custom-hscrollbar-thumb.dragging { background: var(--accent); }
  /* separate, not collapse: sticky <th> cells in a collapsed table leave a seam
     where scrolled body rows bleed through the header's edge in Chromium. Safe
     here since border-bottom/border-top never both land on the same edge. */
  table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 11px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th {
    background: var(--surface2);
    color: var(--dim2); font-weight: 400; letter-spacing: .5px;
    text-transform: uppercase; font-size: 9px; cursor: pointer; user-select: none;
  }
  th:hover { color: var(--accent); }
  th.sorted::after { content: ' ▾'; color: var(--accent); }
  th.sorted.asc::after { content: ' ▴'; }
  /* Group row sticks flush to this box's own top (top:0 -- #table-view is the
     scroll container now, so no external offset needed). The column-label row
     stacks right beneath it, offset by the group row's own measured height. */
  thead tr.grouprow th, thead tr:last-child th { position: sticky; }
  thead tr.grouprow th { top: 0; z-index: 6; }
  thead tr:last-child th { top: var(--tv-group-h, 24px); z-index: 5; }
  tr.grouprow th {
    cursor: default; font-size: 8px; padding: 4px 10px;
    border-bottom: 1px solid var(--border2); border-top: 2px solid;
  }
  tbody tr:hover { background: var(--surface); }
  td.num { text-align: right; color: var(--text-hi); }
  td.gold { color: var(--accent); }
  td.differs { color: var(--warn); }
  td.cut { color: var(--none-col); }
  td.warncell { color: var(--warn); }
  td.cell-text { max-width: 220px; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  td.cell-text:hover { color: var(--text-hi); background: var(--surface2); }
  table.wrap td.cell-text { max-width: 340px; white-space: pre-wrap; overflow: visible; text-overflow: clip; }
  td.cell-text.expanded {
    white-space: pre-wrap; max-width: 480px; overflow: visible; text-overflow: clip;
    background: var(--surface2); color: var(--text-hi);
  }
  .empty-note { color: var(--dim2); padding: 30px; text-align: center; font-style: italic; }

  /* row category stripe + pill (mirrors card .t-* colors) */
  tr.t-name td:first-child { border-left: 3px solid var(--dim2); }
  tr.t-life td:first-child, tr.t-sin td:first-child, tr.t-stance td:first-child { border-left: 3px solid var(--accent); }
  tr.t-dialogue td:first-child { border-left: 3px solid var(--ast-col); }
  tr.t-addressing td:first-child { border-left: 3px solid var(--usr-col); }
  tr.t-narrator td:first-child { border-left: 3px solid var(--accent2); }
  tr.t-info_extraction td:first-child { border-left: 3px solid var(--sys-col); }
  tr.t-player td:first-child { border-left: 3px solid var(--ply-col); }
  .pill {
    display: inline-block; padding: 1px 7px; font-size: 9px; letter-spacing: .5px;
    text-transform: uppercase; border: 1px solid currentColor;
  }
  .pill.t-name { color: var(--dim2); }
  .pill.t-life, .pill.t-sin, .pill.t-stance { color: var(--accent); }
  .pill.t-dialogue { color: var(--ast-col); }
  .pill.t-addressing { color: var(--usr-col); }
  .pill.t-narrator { color: var(--accent2); }
  .pill.t-info_extraction { color: var(--sys-col); }
  .pill.t-player { color: var(--ply-col); }

  /* ── inline-editable eval cell (dialogue rows, Table view) ── */
  .evalsummary-btn {
    font-family: var(--mono); font-size: 10px; padding: 3px 8px; cursor: pointer;
    background: var(--surface2); color: var(--dim2); border: 1px solid var(--border2); white-space: nowrap;
  }
  .evalsummary-btn:hover { color: var(--text-hi); border-color: var(--dim2); }
  .evalsummary-btn.scored { color: var(--accent); border-color: var(--accent); }
  /* single shared popover, positioned via JS with fixed coords -- position:fixed
     (not absolute) so it escapes #table-view's clipping instead of being cropped */
  #eval-popover {
    display: none; position: fixed; z-index: 300;
    width: 300px; max-height: 80vh; overflow-y: auto; padding: 10px; white-space: normal;
    background: var(--surface2); border: 1px solid var(--accent); box-shadow: 0 6px 20px rgba(0,0,0,.5);
  }
  #eval-popover.open { display: block; }

  /* ── table control bar (column-group / row-category toggles) ── */
  .tablebar {
    background: var(--surface); border: 1px solid var(--border);
    padding: 10px 14px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px;
  }
  .tb-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .tb-label { font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: var(--dim2); min-width: 54px; }
  .toggle.grp.on, .toggle.cat.on { color: var(--c); border-color: var(--c); }
</style>
</head>
<body>

<div id="drop-zone">
  <div class="icon">◍</div>
  <h2>NoExit — Run Viewer</h2>
  <p>Drop one or more run JSON files (from <code>runs/</code>). Drop several to compare them in the table view. Also accepts a raw <code>transcript.json</code>.</p>
  <button class="pick-btn" id="pick">Choose files</button>
  <input type="file" id="file-input" accept=".json,application/json" multiple hidden>
</div>

<div id="topbar" style="display:none">
  <div class="brand">NoExit <span id="run-label"></span></div>
  <div class="seg" id="view-seg">
    <button data-view="chargen" class="active">Character Gen</button>
    <button data-view="table">Table</button>
    <button data-view="session">Game Session</button>
  </div>
  <div class="spacer"></div>
  <button class="barbtn" id="wrap-toggle">Wrap text</button>
  <button class="barbtn" id="save-btn">Save evals</button>
  <button class="barbtn" id="add-more">Add files</button>
  <button class="barbtn" id="clear">Clear</button>
</div>

<div id="app">
  <div class="wrap">
    <div class="runstat" id="runstat"></div>
    <div id="chargen-view">
      <div id="chargen-evals"></div>
      <div id="chargen-bios"></div>
    </div>
    <div class="tablebar" id="table-controls" style="display:none">
      <div class="tb-row"><span class="tb-label">Columns</span><div class="toggles" id="colgroup-toggles"></div></div>
      <div class="tb-row"><span class="tb-label">Rows</span><div class="toggles" id="rowcat-toggles"></div></div>
    </div>
    <div id="table-view"></div>
    <div id="session-view"></div>
  </div>
</div>

<script>
// ── state ──
let RUNS = [];   // array of {run_id, meta, state, calls:[...]}
let sortKey = 'idx', sortAsc = true;

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

// ── file loading ──
// Uses the File System Access API (Chrome/Edge) to keep a writable handle per
// loaded run, so edited evals can be saved straight back to the same file.
// Falls back to a plain file input + "download the updated JSON" when that
// API isn't available (e.g. Firefox).
const dz = $('#drop-zone');
const FS_ACCESS_SUPPORTED = 'showOpenFilePicker' in window;

async function openFilePicker(){
  if (!FS_ACCESS_SUPPORTED) { $('#file-input').click(); return; }
  try {
    const handles = await window.showOpenFilePicker({
      multiple: true,
      types: [{ description: 'Run JSON', accept: { 'application/json': ['.json'] } }],
      // Browsers won't let a page hand the picker a hardcoded absolute path (security
      // sandboxing), but `id` makes Chrome/Edge remember the last folder used under
      // this id and reopen there next time. First use: navigate to runs/ once --
      // every open after that (including future sessions) starts there already.
      id: 'noexit-runs',
    });
    for (const handle of handles) {
      try {
        const file = await handle.getFile();
        ingest(JSON.parse(await file.text()), file.name, handle);
      } catch(err){ console.error('Parse error in', handle.name, err); }
    }
    render();
  } catch(err){ if (err.name !== 'AbortError') console.error('File picker error', err); }
}
$('#pick').onclick = openFilePicker;
$('#add-more').onclick = openFilePicker;
$('#file-input').onchange = e => loadFiles(e.target.files);

['dragenter','dragover'].forEach(ev =>
  dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('dragover'); }));
['dragleave','drop'].forEach(ev =>
  dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('dragover'); }));
dz.addEventListener('drop', e => handleDrop(e));
// allow dropping onto the whole window once loaded
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => { e.preventDefault(); if (RUNS.length) handleDrop(e); });

async function handleDrop(e){
  const items = Array.from(e.dataTransfer.items || []);
  const canGetHandles = FS_ACCESS_SUPPORTED && items.length && items[0].getAsFileSystemHandle;
  if (!canGetHandles) { loadFiles(e.dataTransfer.files); return; }
  for (const item of items) {
    if (item.kind !== 'file') continue;
    try {
      const handle = await item.getAsFileSystemHandle();
      if (!handle || handle.kind !== 'file' || !handle.name.endsWith('.json')) continue;
      const file = await handle.getFile();
      ingest(JSON.parse(await file.text()), file.name, handle);
    } catch(err){ console.error('Drop parse error', err); }
  }
  render();
}

function loadFiles(fileList){
  const files = Array.from(fileList).filter(f => f.name.endsWith('.json'));
  let pending = files.length;
  if (!pending) return;
  files.forEach(f => {
    const r = new FileReader();
    r.onload = () => {
      try { ingest(JSON.parse(r.result), f.name, null); }
      catch(err){ console.error('Parse error in', f.name, err); }
      if (--pending === 0) render();
    };
    r.readAsText(f);
  });
}

function ingest(data, fname, handle){
  let run;
  // New run format: {run_id, meta, state, calls:[...]}
  if (data && Array.isArray(data.calls)) {
    run = data;
  }
  // Fallback: raw transcript.json (array of call records)
  else if (Array.isArray(data)) {
    run = { run_id: fname.replace(/\.json$/, ''), meta:{}, state:{}, calls: data };
  } else {
    return;
  }
  run._handle = handle || null;
  run._dirty = false;
  RUNS.push(run);
}

// ── saving edited evals back to disk ──
function markDirty(run){
  run._dirty = true;
  updateSaveButton();
}

function updateSaveButton(){
  const n = RUNS.filter(r => r._dirty).length;
  const btn = $('#save-btn');
  btn.disabled = n === 0;
  btn.textContent = n ? `Save evals (${n})` : 'Save evals';
}

async function saveRun(run){
  const { _handle, _dirty, ...clean } = run;
  const dataStr = JSON.stringify(clean, null, 2);
  if (run._handle) {
    try {
      const writable = await run._handle.createWritable();
      await writable.write(dataStr);
      await writable.close();
      run._dirty = false;
      return true;
    } catch(err){ console.error('Direct save failed, falling back to download', err); }
  }
  const blob = new Blob([dataStr], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (run.run_id || 'run') + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
  run._dirty = false;
  return false;
}

$('#save-btn').onclick = async () => {
  for (const run of RUNS.filter(r => r._dirty)) await saveRun(run);
  updateSaveButton();
};

// ── rendering ──
function render(){
  if (!RUNS.length) return;
  dz.classList.add('hidden');
  $('#topbar').style.display = 'flex';
  $('#app').classList.add('show');

  const totalCalls = RUNS.reduce((a,r)=>a+r.calls.length,0);
  $('#run-label').textContent = RUNS.length === 1
    ? RUNS[0].run_id
    : `${RUNS.length} runs · ${totalCalls} calls`;

  updateSaveButton();
  renderRunStat();
  renderCharGen();
  renderSessionEval();
  requestAnimationFrame(() => { syncChargenHeight(); syncTableHeight(); });
  renderTable();
}

// Game Session view: one whole-session eval card per loaded run (good/bad/neutral +
// notes, same as pair-level and per-call evals). For judging the session as a whole,
// not any single call or character.
function renderSessionEval(){
  const host = $('#session-view'); host.innerHTML = '';
  if (!RUNS.length) return;
  RUNS.forEach(r => {
    const card = document.createElement('div'); card.className = 'charcard';
    const meta = r.meta || {};
    const metaBits = [meta.phase, meta.game_state_version && ('game_state ' + meta.game_state_version)]
      .filter(Boolean).join(' · ');
    card.innerHTML = `
      <div class="charcard-evalh">${esc(r.run_id)} — whole session</div>
      <div class="sub">${esc(r.calls.length)} calls${metaBits ? ' · ' + esc(metaBits) : ''}</div>`;
    r.session_eval = (r.session_eval && typeof r.session_eval === 'object') ? r.session_eval : {};
    card.appendChild(buildEvalForm(r.session_eval, r));
    host.appendChild(card);
  });
}

function num(v){ const n = parseFloat(v); return isNaN(n) ? 0 : n; }

function renderRunStat(){
  const calls = RUNS.flatMap(r => r.calls);
  const tokens = calls.reduce((a,c)=>a+num(c.total_tokens),0);
  const times = calls.map(c=>num(c.response_time_s)).filter(x=>x>0);
  const avg = times.length ? (times.reduce((a,b)=>a+b,0)/times.length) : 0;
  const cold = calls.filter(c => c.cold_start==='true' || c.cold_start===true).length;
  const cut = calls.filter(c => c.finish_reason==='length').length;
  const el = $('#runstat');
  el.innerHTML = '';
  const items = [
    ['Runs', RUNS.length, false],
    ['Calls', calls.length, false],
    ['Total tokens', tokens.toLocaleString(), true],
    ['Avg response', avg.toFixed(2)+'s', false],
    ['Cold starts', cold, false],
    ['Cut off (length)', cut, cut>0],
  ];
  items.forEach(([k,v,gold]) => {
    const d = document.createElement('div'); d.className='item';
    d.innerHTML = `<div class="k">${k}</div><div class="v ${gold?'gold':''}">${v}</div>`;
    el.appendChild(d);
  });
}

// Character Generation view: two independently-scrolling panes sharing the
// same run data -- evals on the left (pair-level + each character's Rubric 1
// form), bios on the right. Neither pane scrolls the page; each scrolls itself.
function renderCharGen(){
  const evalsHost = $('#chargen-evals'); evalsHost.innerHTML = '';
  const biosHost = $('#chargen-bios'); biosHost.innerHTML = '';
  let any = false;

  RUNS.forEach(r => {
    const chars = (r.state && r.state.characters) || {};
    const cids = Object.keys(chars).filter(cid => cid !== '0' && chars[cid] && chars[cid].description);
    if (!cids.length) return;
    any = true;

    const evalGroup = document.createElement('div'); evalGroup.className = 'rungroup';

    const designbar = document.createElement('div'); designbar.className = 'pairbar';
    designbar.innerHTML = `<div class="pairbar-h">Overall character design · ${esc(r.run_id)}</div>`;
    r.character_design_eval = (r.character_design_eval && typeof r.character_design_eval === 'object') ? r.character_design_eval : {};
    designbar.appendChild(buildEvalForm(r.character_design_eval, r));
    evalGroup.appendChild(designbar);

    const pairbar = document.createElement('div'); pairbar.className = 'pairbar';
    pairbar.innerHTML = `<div class="pairbar-h">Pair-level · ${esc(r.run_id)}</div>`;
    r.pair_eval = (r.pair_eval && typeof r.pair_eval === 'object') ? r.pair_eval : {};
    pairbar.appendChild(buildEvalForm(r.pair_eval, r));
    evalGroup.appendChild(pairbar);

    const bioGroup = document.createElement('div'); bioGroup.className = 'rungroup';

    cids.forEach(cid => {
      const c = chars[cid];

      const evalCard = document.createElement('div'); evalCard.className = 'charcard';
      evalCard.innerHTML = `<div class="charcard-evalh">${esc(c.name || 'Char '+cid)} — character generation</div>`;
      c.eval = (c.eval && typeof c.eval === 'object') ? c.eval : {};
      evalCard.appendChild(buildEvalForm(c.eval, r));
      evalGroup.appendChild(evalCard);

      const bioCard = document.createElement('div'); bioCard.className = 'charcard';
      bioCard.innerHTML = `
        <h3>${esc(c.name || '(unnamed)')}</h3>
        <div class="sub">${esc(c.age||'?')}, ${esc(c.gender||'?')} · ${esc(c.occupation||'')} · run ${esc(r.run_id)}</div>
        <div class="bio">${esc(c.description)}<div class="fade"></div></div>
        <span class="more">expand ▾</span>`;
      const bio = bioCard.querySelector('.bio');
      bioCard.querySelector('.more').onclick = () => {
        bio.classList.toggle('expanded');
        bioCard.querySelector('.more').textContent = bio.classList.contains('expanded') ? 'collapse ▴' : 'expand ▾';
      };
      bioGroup.appendChild(bioCard);
    });

    evalsHost.appendChild(evalGroup);
    biosHost.appendChild(bioGroup);
  });

  if (!any) {
    evalsHost.innerHTML = '<div class="evalempty">No character data in the loaded run(s).</div>';
  }
}

const RATINGS = ['good', 'neutral', 'bad'];

// Generic editable score form. Mutates `target` in place ({rating, judge_model, judge_notes})
// and flags `run` dirty on any change. Used for character evals, pair-level evals, and dialogue evals alike.
function buildEvalForm(target, run, onChange){
  const wrap = document.createElement('div');
  wrap.className = 'evalform';

  const badge = document.createElement('div');
  badge.className = 'evalbadge' + (target.judge_model ? ' scored' : '');
  badge.textContent = target.judge_model ? ('scored by ' + target.judge_model) : 'unscored';

  const touch = () => {
    target.judge_model = 'human';
    badge.textContent = 'scored by human';
    badge.classList.add('scored');
    markDirty(run);
    if (onChange) onChange();
  };

  const row = document.createElement('div'); row.className = 'evalrow';
  const btns = document.createElement('div'); btns.className = 'evalbtns';
  RATINGS.forEach(v => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'evalbtn ' + v; b.textContent = v;
    b.onclick = () => {
      target.rating = target.rating === v ? undefined : v;
      Array.from(btns.children).forEach(bb => bb.classList.toggle('active', target.rating === bb.textContent));
      touch();
    };
    if (target.rating === v) b.classList.add('active');
    btns.appendChild(b);
  });
  row.appendChild(btns);
  wrap.appendChild(row);

  const notesRow = document.createElement('div'); notesRow.className = 'evalnotes';
  const ta = document.createElement('textarea');
  ta.placeholder = 'Notes…';
  ta.value = target.judge_notes || '';
  ta.oninput = () => { target.judge_notes = ta.value; touch(); };
  notesRow.appendChild(ta);
  wrap.appendChild(notesRow);
  wrap.appendChild(badge);

  return wrap;
}

// Row categories: which call_types belong to each toggle group + color (mirrors card .t-* colors).
const ROW_CATS = [
  { id:'gen',        label:'Character generation', types:['name','life','sin','stance'], color:'var(--accent)' },
  { id:'narrator',   label:'Narrator',              types:['narrator'],                   color:'var(--accent2)' },

function catForType(t){

  return found ? found.id : 'other';

// Row types scored inline in the table (good/bad/neutral + notes), vs. character-gen
// rows which are scored per-character in the Character Gen view instead.
const INLINE_EVAL_TYPES = ['dialogue', 'addressing', 'info_extraction'];

const colGroupsOn = Object.fromEntries(COL_GROUPS.map(g => [g.id, true]));
const rowCatsOn = Object.fromEntries(ROW_CATS.map(g => [g.id, true]));
let wrapText = false;

function initTableControls(){
  const cg = $('#colgroup-toggles');
  cg.innerHTML = COL_GROUPS.map(g =>
    `<div class="toggle grp on" data-grp="${g.id}" style="--c:${g.color}">${g.label}</div>`).join('');
  cg.onclick = e => {

    `<div class="toggle cat on" data-cat="${g.id}" style="--c:${g.color}">${g.label}</div>`).join('');
  rc.onclick = e => {

    const id = t.dataset.cat; rowCatsOn[id] = !rowCatsOn[id];
    t.classList.toggle('on', rowCatsOn[id]);

function resolveCharacterName(characterNo, state){
  if (characterNo === 0 || characterNo === '0') return 'Player';
  if (characterNo === 3 || characterNo === '3') return 'Narrator';
  const c = state && state.characters && state.characters[String(characterNo)];
  if (c && c.name) return c.name;
  return characterNo!=null ? `Char ${characterNo}` : '';
}

function flatCalls(){
  const out = [];
  // _orig/_run keep the real object references (not this spread copy) so eval
  // edits made from the table mutate the actual run data and are savable.
  // Player messages aren't LLM calls -- they only live in state.dialogue_entries,
  // not r.calls -- so they're synthesized here as read-only rows (no _orig/_run,
  // since there's nothing to save back) and merged in by timestamp so the table
  // reads as one continuous conversation instead of the player's own lines only
  // showing up secondhand inside other calls' user_prompt.
  RUNS.forEach(r => {
    const callRows = r.calls.map(c => ({
      ...c, run_id: c.run_id||r.run_id,
      character_name: resolveCharacterName(c.character_no, r.state),
      _orig: c, _run: r,
    }));
    const playerRows = ((r.state && r.state.dialogue_entries) || [])
      .filter(e => e.character_id === 0 || e.character_id === '0')
      .map(e => ({
        call_type: 'player', character_no: 0, character_name: 'Player',
        timestamp: e.timestamp, run_id: r.run_id, session_id: r.state && r.state.session_id,
        user_prompt: e.dialogue_text,
      }));
    [...callRows, ...playerRows]
      .sort((a,b) => String(a.timestamp||'').localeCompare(String(b.timestamp||'')))
      .forEach(row => { row.idx = out.length; out.push(row); });
  });
  return out;
}

function cellHtml(c, key, kind){
  if (key === 'call_type') {
    const t = (c.call_type||'').replace(/[^a-z_]/g,'');
    return `<span class="pill t-${t}">${esc(c.call_type||'?')}</span>`;
  }
  if (key === 'served_model') {
    const differs = c.served_model && c.requested_model && c.served_model !== c.requested_model;
    return `<span class="${differs?'differs':'gold'}">${esc(shortModel(c.served_model||''))}</span>`;
  }
  if (key === 'finish_reason') {
    const cut = c.finish_reason === 'length';
    return `<span class="${cut?'cut':''}">${esc(c.finish_reason||'')}</span>`;
  }
  if (key === 'retry_count') {
    return num(c.retry_count) > 0 ? `<span class="warncell">${c.retry_count}</span>` : (c.retry_count ?? '');
  }
  if (key === 'cold_start') {
    return (c.cold_start==='true'||c.cold_start===true) ? '<span class="warncell">✓</span>' : '';
  }
  if (key === 'eval_scores_json') {
    // INLINE_EVAL_TYPES rows get their interactive form appended after render
    // (see renderTable); this is just the placeholder/static text for everything else.
    if (INLINE_EVAL_TYPES.includes(c.call_type)) return '';
    const label = ['name','life','sin','stance'].includes(c.call_type) ? 'char-level' : '—';
    return `<span class="evalempty">${label}</span>`;
  }
  if (key === 'judge_model' || key === 'judge_notes') {
    const ev = (c.eval_scores_json && typeof c.eval_scores_json === 'object') ? c.eval_scores_json : null;
    const full = ev && ev[key] != null ? String(ev[key]) : '';
    return `<span title="${escAttr(full)}">${esc(full)}</span>`;
  }
  const v = c[key];
  if (kind === 'text') {
    const full = v==null ? '' : String(v);
    return `<span title="${escAttr(full)}">${esc(full)}</span>`;
  }
  return v==null ? '' : esc(String(v));
}

function summarizeEval(ev){
  if (!ev || !ev.judge_model) return 'score…';
  return ev.rating || 'unrated';
}

// Single shared popover (position:fixed, appended to body) for dialogue-row eval
// editing. Positioned from the clicked button's actual screen coords each time,
// so it always escapes #table-view's clipping and stays on-screen near the click
// instead of being cropped by the table's own scroll box.
const evalPopover = document.createElement('div');
evalPopover.id = 'eval-popover';
document.body.appendChild(evalPopover);

function openEvalPopover(anchorBtn, buildContent){
  evalPopover.innerHTML = '';
  evalPopover.appendChild(buildContent());
  evalPopover.classList.add('open');
  const r = anchorBtn.getBoundingClientRect();
  requestAnimationFrame(() => {
    const pw = evalPopover.offsetWidth, ph = evalPopover.offsetHeight;
    let left = Math.min(r.left, window.innerWidth - pw - 12);
    let top = r.bottom + 4;
    if (top + ph > window.innerHeight - 12) top = Math.max(12, r.top - ph - 4);
    evalPopover.style.left = Math.max(12, left) + 'px';
    evalPopover.style.top = top + 'px';
  });
}
function closeEvalPopover(){ evalPopover.classList.remove('open'); evalPopover.innerHTML = ''; }
document.addEventListener('click', e => {
  if (e.target.closest('#eval-popover') || e.target.closest('.evalsummary-btn')) return;
  closeEvalPopover();
});

// Inline editable eval cell for an INLINE_EVAL_TYPES row's "Eval scores" <td>. Operates
// on the REAL call object (row._orig, not the flattened display copy) so edits are
// savable, and keeps that row's Judge Model/Judge Notes cells in sync as you score.
function dialogueEvalCell(row, cols, tr){
  const c = row._orig, r = row._run;
  c.eval_scores_json = (c.eval_scores_json && typeof c.eval_scores_json === 'object') ? c.eval_scores_json : {};
  const jmIdx = cols.findIndex(cc => cc.key === 'judge_model');
  const jnIdx = cols.findIndex(cc => cc.key === 'judge_notes');

  const btn = document.createElement('button');
  btn.type = 'button'; btn.className = 'evalsummary-btn';

  const refresh = () => {
    btn.textContent = summarizeEval(c.eval_scores_json);
    btn.classList.toggle('scored', !!c.eval_scores_json.judge_model);
    if (jmIdx !== -1 && tr.children[jmIdx]) tr.children[jmIdx].textContent = c.eval_scores_json.judge_model || '';
    if (jnIdx !== -1 && tr.children[jnIdx]) {
      const full = c.eval_scores_json.judge_notes || '';
      tr.children[jnIdx].innerHTML = `<span title="${escAttr(full)}">${esc(full)}</span>`;
    }
  };
  refresh();

  btn.onclick = e => {
    e.stopPropagation();
    openEvalPopover(btn, () => buildEvalForm(c.eval_scores_json, r, refresh));
  };

  return btn;
}

function renderTable(){
  const host = $('#table-view');
  let rows = flatCalls().filter(c => rowCatsOn[catForType(c.call_type)] !== false);
  rows.sort((a,b) => {
    let x = a[sortKey], y = b[sortKey];
    const nx = num(x), ny = num(y);
    const numeric = !isNaN(parseFloat(x)) && !isNaN(parseFloat(y));
    let cmp = numeric ? nx-ny : String(x??'').localeCompare(String(y??''));
    return sortAsc ? cmp : -cmp;
  });

  const activeGroups = COL_GROUPS.filter(g => colGroupsOn[g.id]);
  const cols = activeGroups.flatMap(g => g.cols.map(c => ({ key:c[0], label:c[1], kind:c[2], grp:g.id, color:g.color })));

  const groupRow = activeGroups.map(g =>
    `<th colspan="${g.cols.length}" style="color:${g.color};border-color:${g.color}">${g.label}</th>`).join('');
  const colRow = cols.map(c =>
    `<th data-k="${c.key}" class="${sortKey===c.key?'sorted '+(sortAsc?'asc':''):''}">${c.label}</th>`).join('');

  const body = rows.map(c => {
    const t = (c.call_type||'').replace(/[^a-z_]/g,'');
    const tds = cols.map(col => {
      const cls = [col.kind==='num' ? 'num' : '', col.kind==='text' ? 'cell-text' : ''].filter(Boolean).join(' ');
      return `<td class="${cls}">${cellHtml(c, col.key, col.kind)}</td>`;
    }).join('');
    return `<tr class="t-${t}">${tds}</tr>`;
  }).join('');

  host.innerHTML = rows.length
    ? `<table class="${wrapText?'wrap':''}"><thead><tr class="grouprow">${groupRow}</tr><tr>${colRow}</tr></thead><tbody>${body}</tbody></table>`
    : `<div class="empty-note">No rows match the current row filters.</div>`;

  host.querySelectorAll('thead tr:last-child th').forEach(h => h.onclick = () => {
    const k = h.dataset.k;
    if (sortKey===k) sortAsc = !sortAsc; else { sortKey=k; sortAsc=true; }
    renderTable();
  });
  host.querySelectorAll('td.cell-text').forEach(td => td.onclick = () => td.classList.toggle('expanded'));

  const evalColIdx = cols.findIndex(c => c.key === 'eval_scores_json');
  if (evalColIdx !== -1) {
    host.querySelectorAll('tbody tr').forEach((tr, i) => {
      const row = rows[i];
      if (!INLINE_EVAL_TYPES.includes(row.call_type)) return;
      const td = tr.children[evalColIdx];
      td.innerHTML = '';
      td.appendChild(dialogueEvalCell(row, cols, tr));
    });
  }

  requestAnimationFrame(() => { syncStickyHeader(host); updateHScrollbar(); updateScrollbar(); });
}

// Sticky <thead> rows can't reliably stack in CSS alone across browsers, so their
// `top` offsets are measured from actual rendered heights instead of guessed --
// but written ONCE as a CSS custom property on :root (which the stylesheet's
// sticky rule references) rather than as an inline style on the <th> elements
// themselves. That way a table re-render (toggling a column group destroys and
// recreates the whole <thead>) doesn't reopen a timing gap where the freshly
// created cells briefly use the unset default before JS catches up -- the
// already-correct custom property applies to them immediately.
function syncStickyHeader(host){
  const groupRow = host.querySelector('thead tr.grouprow');
  if (!groupRow) return;
  const groupH = groupRow.getBoundingClientRect().height;
  if (!groupH) return; // host not visible yet -- don't clobber a previously-good measurement
  document.documentElement.style.setProperty('--tv-group-h', groupH + 'px');
}

// Both Character Gen panes are bounded to the remaining viewport height (below
// topbar + runstat) so the page itself never needs to scroll for this view --
// each pane scrolls independently within that fixed band instead.
function syncChargenHeight(){
  const evalsEl = $('#chargen-evals'), biosEl = $('#chargen-bios');
  if (!evalsEl || !biosEl) return;
  const usedH = $('#topbar').offsetHeight + $('#runstat').offsetHeight + 40;
  const h = `calc(100vh - ${usedH}px)`;
  evalsEl.style.height = h;
  biosEl.style.height = h;
}

// Table view is likewise bounded to the remaining viewport height (below topbar +
// runstat + the column/row toggle bar), making #table-view the sole scroll
// container for the table -- see the CSS comment on #table-view for why.
function syncTableHeight(){
  const tv = $('#table-view');
  if (!tv.classList.contains('show')) return;
  const usedH = $('#topbar').offsetHeight + $('#runstat').offsetHeight
    + $('#table-controls').offsetHeight + 40;
  tv.style.height = `calc(100vh - ${usedH}px)`;
}

// ── view toggle ──
$('#view-seg').onclick = e => {
  const b = e.target.closest('button'); if(!b) return;
  $$('#view-seg button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  const v = b.dataset.view;
  $('#chargen-view').classList.toggle('hide', v!=='chargen');
  $('#table-view').classList.toggle('show', v==='table');
  $('#session-view').classList.toggle('show', v==='session');
  $('#table-controls').style.display = v==='table' ? 'flex' : 'none';
  if (v==='chargen') syncChargenHeight();
  if (v==='table') requestAnimationFrame(() => { syncTableHeight(); syncStickyHeader($('#table-view')); updateHScrollbar(); });
  else hScrollbarEl.classList.remove('show');
  updateScrollbar();
};

$('#clear').onclick = () => {
  RUNS = []; $('#topbar').style.display='none'; $('#app').classList.remove('show');
  dz.classList.remove('hidden'); $('#file-input').value='';
};

// ── helpers ──
function esc(s){ return String(s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
function escAttr(s){ return esc(s).replace(/"/g, '&quot;'); }
function shortModel(m){ return String(m||'').replace(/^.*\//,''); }

// ── custom always-visible vertical scrollbar (native scrollbars are unreliable
//    under browsers' overlay-scrollbar rendering, which ignores CSS styling) ──
const scrollbarEl = document.createElement('div');
scrollbarEl.id = 'custom-scrollbar';
const thumbEl = document.createElement('div');
thumbEl.id = 'custom-scrollbar-thumb';
scrollbarEl.appendChild(thumbEl);
document.body.appendChild(scrollbarEl);

// Table view is now bounded (see syncTableHeight) and scrolls internally, so
// this scrollbar's target flips between the page and #table-view depending on
// which one is actually the active scroll container for the current tab.
function activeVScroller(){
  const tv = $('#table-view');
  return tv.classList.contains('show') ? tv : null; // null = page/window
}
function vScrollMetrics(){
  const tv = activeVScroller();
  if (tv) return { top: tv.scrollTop, size: tv.scrollHeight, view: tv.clientHeight };
  return { top: window.scrollY, size: document.documentElement.scrollHeight, view: window.innerHeight };
}
function setVScrollTop(v){
  const tv = activeVScroller();
  if (tv) tv.scrollTop = v; else window.scrollTo(0, v);
}

function updateScrollbar(){
  const { top, size, view } = vScrollMetrics();
  const scrollable = size > view + 1;
  scrollbarEl.classList.toggle('show', scrollable);
  // only the PAGE scrolling needs body padding to reserve the scrollbar's width;
  // #table-view's own box isn't widened by it, so leave body alone in that case
  document.body.classList.toggle('has-custom-scrollbar', scrollable && !activeVScroller());
  if (!scrollable) return;
  const thumbH = Math.max(30, (view / size) * view);
  const maxScroll = size - view;
  const ratio = maxScroll > 0 ? (top / maxScroll) : 0;
  thumbEl.style.height = thumbH + 'px';
  thumbEl.style.top = (ratio * (view - thumbH)) + 'px';
}

let dragging = false, dragStartY = 0, dragStartScroll = 0;
thumbEl.addEventListener('mousedown', e => {
  dragging = true; thumbEl.classList.add('dragging');
  dragStartY = e.clientY; dragStartScroll = vScrollMetrics().top;
  e.preventDefault();
});
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  const { size, view } = vScrollMetrics();
  const thumbH = Math.max(30, (view / size) * view);
  const maxScroll = size - view;
  const scrollDelta = ((e.clientY - dragStartY) / (view - thumbH)) * maxScroll;
  setVScrollTop(dragStartScroll + scrollDelta);
});
window.addEventListener('mouseup', () => { dragging = false; thumbEl.classList.remove('dragging'); });
scrollbarEl.addEventListener('mousedown', e => {
  if (e.target !== scrollbarEl) return; // ignore clicks on the thumb itself
  const { size, view } = vScrollMetrics();
  const thumbH = Math.max(30, (view / size) * view);
  const maxScroll = size - view;
  const clickY = e.clientY - scrollbarEl.getBoundingClientRect().top;
  const ratio = Math.min(1, Math.max(0, (clickY - thumbH / 2) / (view - thumbH)));
  setVScrollTop(ratio * maxScroll);
});

window.addEventListener('scroll', updateScrollbar);
$('#table-view').addEventListener('scroll', updateScrollbar);
window.addEventListener('resize', updateScrollbar);
window.addEventListener('resize', () => {
  const tv = $('#table-view');
  if (tv.classList.contains('show')) { syncTableHeight(); syncStickyHeader(tv); }
});
window.addEventListener('resize', syncChargenHeight);
new ResizeObserver(updateScrollbar).observe(document.body);
new ResizeObserver(updateScrollbar).observe($('#table-view'));
updateScrollbar();

// ── custom always-visible horizontal scrollbar for the (very wide) table ──
// Same reasoning as the vertical one: #table-view's native horizontal scrollbar
// is subject to the same invisible overlay-scrollbar rendering.
const hScrollbarEl = document.createElement('div');
hScrollbarEl.id = 'custom-hscrollbar';
const hThumbEl = document.createElement('div');
hThumbEl.id = 'custom-hscrollbar-thumb';
hScrollbarEl.appendChild(hThumbEl);
document.body.appendChild(hScrollbarEl);

function updateHScrollbar(){
  const tv = $('#table-view');
  const active = tv.classList.contains('show');
  const scrollable = active && tv.scrollWidth > tv.clientWidth + 1;
  hScrollbarEl.classList.toggle('show', scrollable);
  if (!scrollable) return;
  const trackW = hScrollbarEl.clientWidth;
  const thumbW = Math.max(30, (tv.clientWidth / tv.scrollWidth) * trackW);
  const maxScroll = tv.scrollWidth - tv.clientWidth;
  const ratio = maxScroll > 0 ? (tv.scrollLeft / maxScroll) : 0;
  hThumbEl.style.width = thumbW + 'px';
  hThumbEl.style.left = (ratio * (trackW - thumbW)) + 'px';
}

let hDragging = false, hDragStartX = 0, hDragStartScroll = 0;
hThumbEl.addEventListener('mousedown', e => {
  hDragging = true; hThumbEl.classList.add('dragging');
  hDragStartX = e.clientX; hDragStartScroll = $('#table-view').scrollLeft;
  e.preventDefault();
});
window.addEventListener('mousemove', e => {
  if (!hDragging) return;
  const tv = $('#table-view');
  const trackW = hScrollbarEl.clientWidth;
  const thumbW = hThumbEl.offsetWidth;
  const maxScroll = tv.scrollWidth - tv.clientWidth;
  const scrollDelta = ((e.clientX - hDragStartX) / (trackW - thumbW)) * maxScroll;
  tv.scrollLeft = hDragStartScroll + scrollDelta;
});
window.addEventListener('mouseup', () => { hDragging = false; hThumbEl.classList.remove('dragging'); });
hScrollbarEl.addEventListener('mousedown', e => {
  if (e.target !== hScrollbarEl) return; // ignore clicks on the thumb itself
  const tv = $('#table-view');
  const trackW = hScrollbarEl.clientWidth;
  const thumbW = hThumbEl.offsetWidth;
  const maxScroll = tv.scrollWidth - tv.clientWidth;
  const clickX = e.clientX - hScrollbarEl.getBoundingClientRect().left;
  const ratio = Math.min(1, Math.max(0, (clickX - thumbW / 2) / (trackW - thumbW)));
  tv.scrollLeft = ratio * maxScroll;
});

$('#table-view').addEventListener('scroll', updateHScrollbar);
window.addEventListener('resize', updateHScrollbar);
new ResizeObserver(updateHScrollbar).observe($('#table-view'));

initTableControls();
</script>
</body>
</html>
